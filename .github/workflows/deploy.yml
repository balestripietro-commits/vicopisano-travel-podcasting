name: Deploy production

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm deployment of main to the public Netlify site"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and deploy production
    if: github.ref == 'refs/heads/main' && inputs.confirm_production_deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PLAYWRIGHT_BROWSER_CHANNEL: chromium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and run E2E tests
        run: npm run test:e2e:dist

      - name: Deploy tested build to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          test -n "$NETLIFY_AUTH_TOKEN"
          test -n "$NETLIFY_SITE_ID"
          npx --no-install netlify deploy \
            --prod \
            --dir=dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --message="GitHub Actions ${GITHUB_SHA}"

      - name: Smoke test deployed site
        env:
          E2E_BASE_URL: https://transcendent-meerkat-166cbe.netlify.app
        run: npm run test:e2e:smoke

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: production-deploy-diagnostics-${{ github.run_attempt }}
          path: |
            work/e2e-report
            work/e2e-results
          if-no-files-found: ignore
          retention-days: 14
