name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Install Chromium for deployed smoke test
        run: npx playwright install --with-deps chromium

      - name: Smoke test deployed Pages site
        env:
          E2E_BASE_URL: ${{ steps.deployment.outputs.page_url }}
          CI: "true"
          PLAYWRIGHT_BROWSER_CHANNEL: chromium
        run: npx playwright test tests/e2e/production-smoke.spec.mjs --project=mobile-low-chrome

      - name: Upload smoke diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: pages-smoke-diagnostics-${{ github.run_attempt }}
          path: work/e2e-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 3
